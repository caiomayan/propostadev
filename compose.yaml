services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propostadev}
      POSTGRES_USER: ${POSTGRES_USER:-proposta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_proposta_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - proposta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  proposta_data:
