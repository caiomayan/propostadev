# Checagem de disponibilidade da produção (retro de 24/11: a queda por senha do banco só foi notada à mão).
# Se a home ou a busca não responderem 200, o job falha e o GitHub avisa por e-mail quem editou este agendamento por último.
# Repositório público: minutos de Actions não são cobrados.
name: Disponibilidade

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: disponibilidade
  cancel-in-progress: true

jobs:
  producao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Home e busca respondem 200
        env:
          BASE_URL: https://propostadev-one.vercel.app
        run: |
          falhou=0
          for caminho in / /buscar; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$BASE_URL$caminho" || true)
            echo "$caminho -> $status"
            if [ "$status" != "200" ]; then falhou=1; fi
          done
          exit $falhou
